<html lang="ru">
<head>

<title>中文学习 — Китайский язык</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--fn:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--cjk:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
--bg:#ffffff;--fg:#3c3c3c;--m:#777777;--m2:#afafaf;--cd:#ffffff;--bd:#e5e5e5;--bd2:#cecece;
--pri:#12a99f;--prid:#0b8179;--pril:#d9f4f1;--sel:#1cb0f6;--seld:#1899d6;--sell:#ddf4ff;
--ok:#58b730;--okd:#43951f;--okl:#d7ffb8;--okt:#4a8b1f;--no:#ff4b4b;--nod:#e02b2b;--nol:#ffdfe0;--not:#d33131;
--gold:#ffc800;--goldd:#e0a800;--fire:#ff9600;--pur:#a560f0;--t1:#e5484d;--t2:#30a46c;--t3:#0090ff;--t4:#8e4ec6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--fg:#f1f7fb;--m:#a8b8c0;--m2:#52656d;--cd:#131f24;--bd:#37464f;--bd2:#24333a;--pril:#16393a;--sell:#10334a;--okl:#1f3514;--okt:#79d634;--nol:#3f1d20;--not:#ff8a8a;--t1:#ff6b6e;--t2:#4cc38a;--t3:#4fb1ff;--t4:#bf7af0}}
:root[data-theme="dark"]{--bg:#131f24;--fg:#f1f7fb;--m:#a8b8c0;--m2:#52656d;--cd:#131f24;--bd:#37464f;--bd2:#24333a;--pril:#16393a;--sell:#10334a;--okl:#1f3514;--okt:#79d634;--nol:#3f1d20;--not:#ff8a8a;--t1:#ff6b6e;--t2:#4cc38a;--t3:#4fb1ff;--t4:#bf7af0}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font:600 17px/1.5 var(--fn);-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
main.tab{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main.les{padding-bottom:calc(260px + env(safe-area-inset-bottom,0px))}
svg{width:1.2em;height:1.2em;flex:none}
p{margin:6px 0}.m{color:var(--m);font-size:15px}.d{display:block}
h1.ph{font-size:26px;font-weight:900;margin:14px 0 4px;line-height:1.25}
h2{font-size:18px;font-weight:900;margin:24px 0 8px}
.zh{font:500 30px/1.3 var(--cjk)}.zh2{font:500 22px/1.3 var(--cjk)}.py{font-size:16px;color:var(--m)}
u{text-decoration:none;font-weight:800}.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}
button{font-family:var(--fn)}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.row{display:flex;align-items:center;gap:12px}
.card{background:var(--cd);border:2px solid var(--bd);border-radius:16px;padding:14px 16px;margin:10px 0}
button.card{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border-bottom-width:4px}
button.card:active{transform:translateY(2px);border-bottom-width:2px}
.bk{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--m);font:800 15px var(--fn);padding:14px 0 2px;cursor:pointer}.bk svg{width:20px;height:20px}
/* buttons */
.b{display:block;width:100%;margin-top:10px;padding:13px 16px;border:0;border-radius:16px;background:var(--pri);color:#fff;font:800 16px/1.2 var(--fn);text-transform:uppercase;letter-spacing:.05em;box-shadow:0 4px 0 var(--prid);cursor:pointer}
.b.big{margin-top:0;padding:15px 16px}
.b:active{transform:translateY(4px);box-shadow:none}
.b:disabled{background:var(--bd);color:var(--m2);box-shadow:none;cursor:default;transform:none}
.b.ok{background:var(--ok);box-shadow:0 4px 0 var(--okd)}.b.no{background:var(--no);box-shadow:0 4px 0 var(--nod)}
.b.g{background:var(--cd);color:var(--sel);border:2px solid var(--bd);box-shadow:0 4px 0 var(--bd)}
.b.w{background:#fff;color:var(--ud);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.b.w2{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.75);box-shadow:none}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.dual .b{margin-top:0}
/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-bottom:2px solid var(--bd);margin:0 -16px;padding:10px 18px}
.crs{width:42px;height:34px;border-radius:10px;background:#e8423f;color:#fff;display:grid;place-items:center;font:600 20px var(--cjk);box-shadow:0 3px 0 #b52f2c}
.st{display:flex;align-items:center;gap:5px;font-weight:900;font-size:17px}.st svg{width:26px;height:26px}
.st.fire svg{color:var(--fire)}.st.fire.off svg{color:var(--m2)}.st.bolt svg{color:var(--gold)}.st.gem svg{color:var(--pri)}
.goal{display:flex;align-items:center;gap:12px;margin-top:14px}.goal>svg{width:34px;height:34px;color:var(--gold)}
.pbm{display:block;height:12px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:6px}.pbm i{display:block;height:100%;background:var(--gold);border-radius:99px}
/* path */
.ub{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--u);color:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 4px 0 var(--ud);margin:22px 0 6px}
.us{display:block;font-size:13px;font-weight:800;opacity:.9}.un{display:block;font-size:20px;font-weight:900;line-height:1.25}.up{display:block;font-size:13px;font-weight:700;opacity:.9;margin-top:2px}
.ug{width:50px;height:50px;border-radius:14px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}.ug svg{width:26px;height:26px}
.path{display:flex;flex-direction:column;align-items:center;padding:12px 0 18px}
.nd{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:10px}
.nd.hastip{margin-top:52px}
.ring{position:relative;display:grid;place-items:center;width:96px;height:96px;border-radius:50%}
.ring.on{background:conic-gradient(var(--u) var(--p),var(--bd) 0)}
.ring.on::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.node{position:relative;z-index:1;width:72px;height:64px;margin-top:-6px;border:0;border-radius:50%;background:var(--u);color:#fff;box-shadow:0 7px 0 var(--ud);display:grid;place-items:center;cursor:pointer}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ud)}
.node.ok{background:var(--gold);box-shadow:0 7px 0 var(--goldd)}
.node.fu{background:var(--bd);box-shadow:0 7px 0 var(--bd2);color:var(--m2)}
.tip{position:absolute;top:-46px;left:50%;transform:translateX(-50%);z-index:2;background:var(--cd);color:var(--u);border:2px solid var(--bd);border-radius:12px;padding:7px 14px;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;animation:bob 1s ease-in-out infinite alternate}
.tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--cd);border-right:2px solid var(--bd);border-bottom:2px solid var(--bd);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{to{transform:translate(-50%,-6px)}}
.pop{position:relative;width:min(340px,100%);background:var(--u);color:#fff;border-radius:18px;padding:16px;margin:16px auto 6px;box-shadow:0 4px 0 var(--ud)}
.pop::before{content:"";position:absolute;top:-8px;left:calc(50% + var(--o) - 9px);width:18px;height:18px;background:var(--u);border-radius:3px;transform:rotate(45deg)}
.pt{display:block;font-size:18px;font-weight:900;line-height:1.3}.pop p{opacity:.92;font-size:15px}
.lk2{display:block;margin:12px auto 0;background:none;border:0;color:#fff;font:800 15px var(--fn);text-decoration:underline;cursor:pointer}
.soon{text-align:center;color:var(--m2);font-weight:800;padding:22px 0 8px;border-top:2px dashed var(--bd);margin-top:10px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:2px solid var(--bd);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:100px;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:2px solid transparent;border-radius:14px;padding:5px 0;color:var(--m2);font:800 11px var(--fn);cursor:pointer}
nav svg{width:26px;height:26px}nav button.cur{color:var(--sel);border-color:var(--sel);background:var(--sell)}
/* exercise shell */
.lh{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:14px;padding:14px 0 10px}
.x{background:none;border:0;color:var(--m2);padding:4px;cursor:pointer;display:grid}.x svg{width:28px;height:28px}
.pb{flex:1;height:16px;border-radius:99px;background:var(--bd);overflow:hidden}
.pb i{display:block;height:100%;border-radius:99px;background:var(--ok) linear-gradient(to bottom,transparent 3px,rgba(255,255,255,.3) 3px,rgba(255,255,255,.3) 6px,transparent 6px);transition:width .45s ease}
.cmbt{display:flex;align-items:center;gap:2px;color:var(--fire);font-weight:900}.cmbt svg{width:22px;height:22px}
.lk{color:var(--pur);font-weight:900;font-size:14px;letter-spacing:.03em;margin-top:6px}
.lt{font-size:23px;font-weight:900;line-height:1.3;margin:6px 0 16px}
.say{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.av{width:58px;height:58px;border-radius:50%;background:var(--pril);color:var(--pri);display:grid;place-items:center;font:600 26px var(--cjk);flex:none}.av svg{width:28px;height:28px}
.bub{position:relative;flex:1;border:2px solid var(--bd);border-radius:16px;padding:12px 16px;font-size:18px;font-weight:700}
.bub::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--bg);border-left:2px solid var(--bd);border-bottom:2px solid var(--bd);transform:translateY(-50%) rotate(45deg)}
.ctr{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 10px}
.sp{width:46px;height:46px;border:0;border-radius:14px;background:var(--sel);color:#fff;box-shadow:0 4px 0 var(--seld);display:grid;place-items:center;cursor:pointer;flex:none}
.sp svg{width:24px;height:24px}.sp:active{transform:translateY(4px);box-shadow:none}
.sp.big{width:116px;height:116px;border-radius:28px;box-shadow:0 6px 0 var(--seld)}.sp.big svg{width:56px;height:56px}
.ol{display:grid;gap:10px;margin:14px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opt{width:100%;min-height:58px;padding:12px 16px;background:var(--cd);color:var(--fg);border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;font:700 17px/1.35 var(--fn);text-align:left;cursor:pointer}
.g2 .opt{text-align:center;min-height:86px;display:grid;place-items:center}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt.sel{border-color:var(--sel);background:var(--sell);color:var(--seld)}
.opt.ok{border-color:var(--ok);background:var(--okl);color:var(--okt)}
.opt.no{border-color:var(--no);background:var(--nol);color:var(--not)}
.opt.dim{opacity:.5}
.ft{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bg);border-top:2px solid var(--bd);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.fi{max-width:560px;margin:0 auto}
.ft.okf{background:var(--okl);border-color:transparent;animation:up .22s ease-out}.ft.nof{background:var(--nol);border-color:transparent;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.fh{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.fic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}.fic svg{width:26px;height:26px}
.okf .fic{color:var(--ok)}.nof .fic{color:var(--no)}
.ftt{display:block;font-size:22px;font-weight:900;line-height:1.25}.okf .ftt,.okf .ftb{color:var(--okt)}.nof .ftt,.nof .ftb{color:var(--not)}
.ftb{font-size:16px;font-weight:700;margin-top:2px;max-height:36vh;overflow:auto}
.ftb .sp{width:38px;height:38px;border-radius:12px;margin-top:8px}.ftb .sp svg{width:20px;height:20px}
.cmb{display:inline-flex;align-items:center;gap:2px;color:var(--fire);font-weight:900;margin-left:8px}.cmb svg{width:20px;height:20px}
/* sentence builder */
.ans{min-height:132px;margin:6px 0 20px;padding-top:3px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 63px,var(--bd) 63px,var(--bd) 65px)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;height:58px;min-width:52px;padding:4px 12px;background:var(--cd);color:var(--fg);border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;cursor:pointer}
.chip .zh2{font-size:22px;line-height:1.15}.chip small{font-size:12px;color:var(--m);line-height:1.1}
.chip:active{transform:translateY(2px);border-bottom-width:2px}.chip:disabled{cursor:default;transform:none}
.chip.ph{background:var(--bd);border-color:var(--bd);cursor:default}.chip.ph>*{visibility:hidden}
/* dialogue */
.dt{font-weight:900;color:var(--m);font-size:15px;margin:2px 0 6px}
.msg{display:flex;gap:10px;align-items:flex-end;margin:12px 0}
.msg .av{width:44px;height:44px}.msg .bub{flex:0 1 auto;max-width:84%;padding:10px 14px}
.msg .bub::before{top:auto;bottom:10px;transform:rotate(45deg)}
.msg.me{justify-content:flex-end}.msg.me .bub{background:var(--sell);border-color:var(--sel)}.msg.me .bub::before{display:none}
.bub .sp{width:34px;height:34px;border-radius:10px;margin-top:6px;box-shadow:0 3px 0 var(--seld)}.bub .sp svg{width:18px;height:18px}
.tk{font-weight:800;margin:18px 0 2px}
/* ruby: pinyin above each word */
.rb{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 10px;margin:4px 0}
.rwp{display:inline-flex;align-items:flex-end}.rw{display:inline-flex;flex-direction:column;align-items:center}
.rw small{font:700 14px/1.3 var(--fn);color:var(--m)}.rw b{font-weight:500;position:relative}.pu{position:absolute;left:100%;bottom:0;font-style:normal}.rwp.hp{margin-right:.6em}
.opt .rb{margin:0}
/* lists & cards */
.gi{width:54px;height:54px;border-radius:14px;background:var(--pril);color:var(--pri);display:grid;place-items:center;font:600 24px var(--cjk);flex:none}.gi svg{width:28px;height:28px}
.gi.chat{background:var(--sell);color:var(--sel)}.gi.red{background:var(--nol);color:var(--no)}.gi.gold{background:#fff4cc;color:#d99a00}
.gx{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}.gx b{font-weight:900;line-height:1.3}
.chv{color:var(--m2)}.okm{color:var(--gold);display:grid}.okm svg{width:28px;height:28px}
.note .nt{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--pri);margin-bottom:4px}.note .nt svg{width:22px;height:22px}
.exr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wl{display:grid;gap:8px;margin-top:10px}
.wc{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--bd);border-radius:16px;padding:10px 14px}
.wc.ok{border-color:var(--gold)}.wz{display:flex;flex-direction:column}.wz .zh{font-size:28px;line-height:1.25}
.wr{display:flex;flex-direction:column;align-items:center;gap:8px}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--gold)}
.sum b{font-size:22px;font-weight:900}
/* results */
.res{text-align:center;padding:36px 0 10px}.medal svg{width:150px;height:150px}
.res h1{font-size:28px;font-weight:900;margin:10px 0 2px;color:var(--pri)}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0 10px}
.stb{border:2px solid var(--c);border-radius:16px;background:var(--c);overflow:hidden}
.stb b{display:block;color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding:5px 2px}
.stb span{display:flex;justify-content:center;align-items:center;gap:4px;background:var(--bg);border-radius:13px;padding:14px 4px;font-size:20px;font-weight:900;color:var(--c)}
.stb.gold{--c:#f5b400}.stb.grn{--c:var(--ok)}.stb.blu{--c:var(--sel)}
/* profile */
.pfh{display:flex;gap:14px;align-items:center;margin:14px 0}
.pav{width:76px;height:76px;border-radius:50%;background:var(--pril);color:var(--pri);border:3px solid var(--pri);display:grid;place-items:center;font:600 36px var(--cjk);flex:none}
.pfh b{display:block;font-size:21px;font-weight:900}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{display:flex;gap:10px;align-items:center;border:2px solid var(--bd);border-radius:16px;padding:12px}.sc svg{width:28px;height:28px}
.sc b{display:block;font-size:20px;font-weight:900;line-height:1.1}.sc div span{font-size:13px;color:var(--m);font-weight:700}
.c-fire{color:var(--fire)}.c-bolt{color:var(--gold)}.c-gem{color:var(--pri)}.c-gold{color:#e0a000}.c-blu{color:var(--sel)}.c-pur{color:var(--pur)}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gch{border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;background:var(--cd);color:var(--fg);padding:12px 14px;font:inherit;cursor:pointer;text-align:left}
.gch b{display:block;font-weight:900}.gch span{font-size:13px;color:var(--m)}.gch.on{border-color:var(--sel);background:var(--sell)}
.tg{width:54px;height:32px;border-radius:99px;background:var(--bd);position:relative;flex:none;transition:background .2s}
.tg i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}.tg.on{background:var(--ok)}.tg.on i{left:26px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

{n:['你想喝什么？','Nǐ xiǎng hē shénme?','Что вы хотите выпить?'],g:'скажите «хочу воды, спасибо».',o:[['我想喝水，谢谢。','Wǒ xiǎng hē shuǐ, xièxie.','Хочу воды, спасибо.'],['我想喝水，对不起。','Wǒ xiǎng hē shuǐ, duìbuqǐ.'],['我想水喝，谢谢。','Wǒ xiǎng shuǐ hē, xièxie.']],e:'谢谢 — «спасибо», 对不起 — «извините» (когда вы виноваты). Дополнение стоит после глагола: 喝水.'},
{n:['这里的菜很好吃！','Zhèlǐ de cài hěn hǎochī!','Здешние блюда очень вкусные!'],g:'согласитесь: «да, очень вкусно!»',o:[['对，非常好吃！','Duì, fēicháng hǎochī!','Да, очень вкусно!'],['对，好吃非常！','Duì, hǎochī fēicháng!'],['对，非常吃好！','Duì, fēicháng chī hǎo!']],e:'Наречие степени 非常 («очень») стоит перед прилагательным: 非常好吃. 对 — «верно, да».'}]}

DLG.push({t:'Договориться о встрече',g:'Куда, во сколько, «до завтра».',s:[

{n:['你想几点去？','Nǐ xiǎng jǐ diǎn qù?','Во сколько хочешь пойти?'],g:'ответьте «в три часа дня».',o:[['下午三点去。','Xiàwǔ sān diǎn qù.','В три часа дня.'],['三点下午去。','Sān diǎn xiàwǔ qù.'],['去下午三点。','Qù xiàwǔ sān diǎn.']],e:'Время идёт от крупного к мелкому (下午 → 三点) и стоит перед глаголом.'},
{n:['我也去，好吗？','Wǒ yě qù, hǎo ma?','Я тоже пойду, хорошо?'],g:'согласитесь и скажите «до завтра».',o:[['好，明天见！','Hǎo, míngtiān jiàn!','Хорошо, до завтра!'],['好，再见明天！','Hǎo, zàijiàn míngtiān!'],['不客气，明天见！','Bú kèqi, míngtiān jiàn!']],e:'明天见 — «до завтра» (букв. «завтра увидимся»). 不客气 отвечают только на «спасибо».'}]});

{n:['你去药店买药吧。','Nǐ qù yàodiàn mǎi yào ba.','Сходи в аптеку, купи лекарство.'],g:'спросите «аптека далеко отсюда?»',o:[['药店离这儿远吗？','Yàodiàn lí zhèr yuǎn ma?','Аптека далеко отсюда?'],['药店远离这儿吗？','Yàodiàn yuǎn lí zhèr ma?'],['这儿离药店吗远？','Zhèr lí yàodiàn ma yuǎn?']],e:'Модель: A 离 B 远 / 近. Прилагательное стоит после B, а 吗 — в самом конце.'},

{h:2,t:'Как пройти к метро?',g:'Объяснить дорогу, сказать «десять минут пешком», «я иностранец».',s:[

{n:['离这儿远不远？','Lí zhèr yuǎn bu yuǎn?','Далеко отсюда?'],g:'ответьте «недалеко, десять минут пешком».',o:[['不远，走路十分钟。','Bù yuǎn, zǒulù shí fēnzhōng.','Недалеко, десять минут пешком.'],['不远，走路十个分钟。','Bù yuǎn, zǒulù shí gè fēnzhōng.'],['没远，走路十分钟。','Méi yuǎn, zǒulù shí fēnzhōng.']],e:'分钟, 天, 年 сами служат счётными словами, 个 с ними не ставят: 十分钟 (но 一个小时). Прилагательное отрицают через 不, а не 没. Вопрос «远不远?» равен «远吗?».'},
{n:['你是这儿的人吗？','Nǐ shì zhèr de rén ma?','Вы местный?'],g:'«Нет, я иностранец, учусь здесь».',o:[['不是，我是外国人，在这儿学习。','Bú shì, wǒ shì wàiguórén, zài zhèr xuéxí.','Нет, я иностранец, учусь здесь.'],['不是，我是外国人，学习在这儿。','Bú shì, wǒ shì wàiguórén, xuéxí zài zhèr.'],['没有，我是外国人，在这儿学习。','Méiyǒu, wǒ shì wàiguórén, zài zhèr xuéxí.']],e:'На вопрос «是…吗?» отвечают 不是, а не 没有. Место действия (在这儿) стоит перед глаголом: 在这儿学习.'}]},
{h:2,t:'Воскресенье и хобби',g:'Что делаешь обычно, как у тебя получается, договориться.',s:[

{n:['你游得怎么样？','Nǐ yóu de zěnmeyàng?','Как ты плаваешь?'],g:'ответьте «плаваю неплохо, но медленно».',o:[['游得不错，但是很慢。','Yóu de búcuò, dànshì hěn màn.','Неплохо, но медленно.'],['游不错得，但是很慢。','Yóu búcuò de, dànshì hěn màn.'],['不错游得，但是很慢。','Búcuò yóu de, dànshì hěn màn.']],e:'Оценка действия: глагол + 得 + оценка (游得不错). 但是 — «но».'},
{n:['下个星期天我们一起去吧！','Xià gè xīngqītiān wǒmen yìqǐ qù ba!','В следующее воскресенье давай пойдём вместе!'],g:'согласитесь и скажите «я тебе позвоню».',o:[['好啊！我给你打电话。','Hǎo a! Wǒ gěi nǐ dǎ diànhuà.','Давай! Я тебе позвоню.'],['好啊！我给打电话你。','Hǎo a! Wǒ gěi dǎ diànhuà nǐ.'],['好啊！我电话给你打。','Hǎo a! Wǒ diànhuà gěi nǐ dǎ.']],e:'Кому звонить: 给 + человек + 打电话 (我给你打电话). 啊 делает ответ тёплым и живым.'}]}

WS.push(
{t:'Мы, они и люди',g:'Множественное число, обращения, профессии.',n:'们 образует множественное число местоимений и слов о людях: 我们, 老师们. С числами 们 не ставят: 三个学生, а не 三个学生们.',w:'我们|wǒmen|мы;你们|nǐmen|вы (мн. ч.);他们|tāmen|они;她们|tāmen|они (о женщинах);它|tā|оно (о животных и предметах);它们|tāmen|они (о животных и предметах);们|men|суффикс множественного числа;大家|dàjiā|все;人|rén|человек, люди;男|nán|мужской;女|nǚ|женский;先生|xiānsheng|господин;女士|nǚshì|госпожа;同学|tóngxué|одноклассник, однокурсник;医生|yīshēng|врач',s:['我们 是 同学|。|Мы однокурсники.','大家 好|！|Всем привет!','他 是 医生|。|Он врач.','她们 是 老师 吗|？|Они учительницы?']},
{t:'Близкие и животные',g:'Дети, пары, домашние животные, «любить».',n:'爱 — сильное чувство («любить» человека). О вкусах и занятиях чаще говорят 喜欢: 我喜欢猫.',w:'孩子|háizi|ребёнок;小朋友|xiǎopéngyǒu|ребёнок, малыш (обращение);家人|jiārén|члены семьи;儿子|érzi|сын;女儿|nǚ’ér|дочь;男朋友|nánpéngyou|парень (бойфренд);女朋友|nǚpéngyou|девушка (возлюбленная);爱|ài|любить;猫|māo|кошка;狗|gǒu|собака',s:['我 有 一 个 儿子|。|У меня есть сын.','我 爱 我 的 家人|。|Я люблю свою семью.','他 女儿 很 漂亮|。|Его дочь очень красивая.','你 有 女朋友 吗|？|У тебя есть девушка?']},
{t:'Этот, тот, который',g:'Указательные слова и частицы 呢 и 吧.',n:'Перед существительным после 这, 那, 哪 ставят счётное слово: 这个人, 那个苹果. 呢 после слова значит «а как насчёт…?»: 我很好，你呢? 吧 смягчает предложение: 我们去吧 — «давай пойдём».',w:'那|nà|тот, то;这个|zhège|этот;那个|nàge|тот;哪|nǎ|какой? который?;哪个|nǎge|какой? который? (с 个);这里|zhèlǐ|здесь;那里|nàli|там;哪里|nǎlǐ|где?;这边|zhèbiān|эта сторона, здесь;那边|nàbian|та сторона, там;这些|zhèxiē|эти;那些|nàxiē|те;哪些|nǎxiē|какие?;怎么|zěnme|как?;呢|ne|частица «а …?»;吧|ba|частица предложения «давай…»',s:['哪个 是 你 的 书|？|Какая книга твоя?','我们 去 吧|。|Давай пойдём.','你 怎么 去 学校|？|Как ты добираешься до школы?','这里 有 超市 吗|？|Здесь есть супермаркет?']},
{t:'Еда и посуда',g:'Блюда, приёмы пищи, «вкусно».',n:'Приём пищи + 吃: 吃早饭 «завтракать», 吃午饭 «обедать». 好 + глагол значит «приятно делать»: 好吃 «вкусный», 好看 «красивый», 好听 «приятный на слух».',w:'饭|fàn|еда, варёный рис;菜|cài|блюдо, овощи;包子|bāozi|баоцзы (паровой пирожок);饺子|jiǎozi|цзяоцзы (пельмени);面包|miànbāo|хлеб;面条儿|miàntiáor|лапша;鸡蛋|jīdàn|куриное яйцо;牛奶|niúnǎi|молоко;水果|shuǐguǒ|фрукты;杯子|bēizi|стакан, чашка;早饭|zǎofàn|завтрак;午饭|wǔfàn|обед;晚饭|wǎnfàn|ужин;好吃|hǎochī|вкусный;做饭|zuòfàn|готовить еду;饭店|fàndiàn|ресторан, гостиница',s:['我 早上 吃 面包|。|Утром я ем хлеб.','饺子 很 好吃|。|Цзяоцзы очень вкусные.','妈妈 在 做饭|。|Мама готовит еду.','我 想 喝 牛奶|。|Я хочу молока.']},
{t:'Даты и возраст',g:'Год, месяц, число, дни недели, сколько лет.',n:'Дата идёт от большего к меньшему: год → месяц → число: 十月三号. Воскресенье — 星期天 или 星期日. Возраст: 你几岁? (ребёнку), 他九岁 — 是 не нужен.',w:'年|nián|год;月|yuè|месяц;日|rì|день, число (письм.);号|hào|число (в дате), номер;天|tiān|день, небо;今年|jīnnián|в этом году;明年|míngnián|в следующем году;去年|qùnián|в прошлом году;星期日|xīngqīrì|воскресенье;星期天|xīngqītiān|воскресенье (разг.);岁|suì|год (о возрасте)',s:['今天 几 号|？|Какое сегодня число?','你 几 岁|？|Сколько тебе лет? (ребёнку)','我 明年 去 中国|。|В следующем году я поеду в Китай.','星期天 我 不 上班|。|В воскресенье я не работаю.']},
{t:'Время суток и длительность',g:'Утро, полдень, час и минута, «половина».',n:'点 — «час» на циферблате (三点), 小时 — продолжительность (三个小时). Так же 分 (三点十分) и 分钟 (十分钟). Половина: 三点半 — «половина четвёртого».',w:'早上|zǎoshang|утро;中午|zhōngwǔ|полдень;白天|báitiān|днём, в светлое время;早|zǎo|рано;晚|wǎn|поздно;时候|shíhou|время, момент;时间|shíjiān|время;小时|xiǎoshí|час (длительность);分钟|fēnzhōng|минута (длительность);分|fēn|минута (на часах);半|bàn|половина',s:['现在 三 点 半|。|Сейчас половина четвёртого.','你 什么 时候 起床|？|Когда ты встаёшь?','我 没有 时间|。|У меня нет времени.','我 明天 学习 一 个 小时|。|Завтра я позанимаюсь один час.']},
{t:'Сколько? Числа и счётные слова',g:'Сто, тысяча, юань, «немного», порядковые числа.',n:'У предметов свои счётные слова: 一本书, 一件衣服, 三口人 (о семье). Порядковое число — 第 + число: 第一. 有点儿 + прилагательное — «немного (и это плохо)»: 有点儿贵. 一 перед 4-м тоном читается yí, перед остальными — yì: 一个 yí gè, 一百 yì bǎi.',w:'零|líng|ноль;百|bǎi|сто;千|qiān|тысяча;元|yuán|юань;一半|yíbàn|половина;一点儿|yìdiǎnr|немного;一些|yìxiē|несколько, немного;些|xiē|несколько (счётное слово);有的|yǒude|некоторые;有些|yǒuxiē|некоторые, немного;有点儿|yǒudiǎnr|слегка, немного (о неприятном);第|dì|приставка порядкового числа;口|kǒu|рот, счётное слово для членов семьи;本|běn|счётное слово для книг;件|jiàn|счётное слово для одежды и дел;一下|yíxià|разок, немного (после глагола)',s:['我 家 有 三 口 人|。|У нас в семье три человека.','这 本 书 一 百 元|。|Эта книга стоит сто юаней.','今天 有点儿 冷|。|Сегодня немного холодно.','我 看 一下|。|Дай-ка я посмотрю.']},
{t:'Учёба и работа',g:'Школа, урок, вопрос, компания, «знать».',n:'上 и 下 с уроком и работой: 上课 — «урок начинается», 下课 — «урок окончен», 上班 и 下班 — начало и конец рабочего дня. 知道 — «знать факт», 认识 — «быть знакомым с человеком».',w:'学|xué|учить(ся);上学|shàngxué|ходить в школу;上课|shàngkè|идти на урок;下课|xiàkè|заканчивать урок;课|kè|урок;问|wèn|спрашивать;问题|wèntí|вопрос, проблема;字|zì|иероглиф;中文|Zhōngwén|китайский язык;读书|dúshū|читать, учиться;小学|xiǎoxué|начальная школа;中学|zhōngxué|средняя школа;大学|dàxué|университет;小学生|xiǎoxuéshēng|младший школьник;中学生|zhōngxuéshēng|школьник (средней школы);大学生|dàxuéshēng|студент вуза;上班|shàngbān|ходить на работу;下班|xiàbān|заканчивать работу;公司|gōngsī|компания;知道|zhīdào|знать',s:['我 有 一 个 问题|。|У меня есть вопрос.','我 哥哥 在 公司 上班|。|Мой старший брат работает в компании.','你 知道 吗|？|Ты знаешь?','她 是 大学生|。|Она студентка.','我们 几 点 上课|？|Во сколько у нас урок?']},
{t:'Распорядок дня',g:'Вставать, спать, одеваться, отдыхать.',n:'Многие глаголы идут парой с дополнением: 起床, 睡觉, 唱歌. 给 + человек + глагол: 给妈妈打电话 — «позвонить маме».',w:'起床|qǐchuáng|вставать с постели;睡|shuì|спать;睡觉|shuìjiào|спать, ложиться спать;休息|xiūxi|отдыхать;穿|chuān|надевать, носить;衣服|yīfu|одежда;玩|wán|играть, развлекаться;唱|chàng|петь;歌|gē|песня;找|zhǎo|искать;给|gěi|давать, для (кого-то);开|kāi|открывать, включать',s:['我 七 点 起床|。|Я встаю в семь часов.','我们 去 唱 歌 吧|。|Давай пойдём петь.','你 在 找 什么|？|Что ты ищешь?','我 想 休息 一下|。|Я хочу немного отдохнуть.']},
{t:'Телефон, кино, досуг',g:'Звонить, компьютер, фильм, «интересно».',n:'看 и 听 — процесс («смотреть», «слушать»), 看见 и 听见 — результат («увидеть», «услышать»).',w:'打电话|dǎ diànhuà|звонить по телефону;电话|diànhuà|телефон;手机|shǒujī|мобильный телефон;电脑|diànnǎo|компьютер;电影|diànyǐng|фильм;电影院|diànyǐngyuàn|кинотеатр;说话|shuōhuà|разговаривать;听见|tīngjiàn|услышать;看见|kànjiàn|увидеть;好看|hǎokàn|красивый, интересный (о фильме);好听|hǎotīng|приятный на слух;好玩儿|hǎowánr|весёлый, интересный',s:['我 给 妈妈 打电话|。|Я звоню маме.','这个 电影 很 好看|。|Этот фильм очень интересный.','我们 去 电影院 吧|。|Давай сходим в кино.']},
{t:'Транспорт и жильё',g:'Поезд, самолёт, машина, комната, «жить».',n:'На транспорте едут с 坐: 坐火车, 坐飞机; машину водят — 开车. Где живёшь: 住在 + место: 我住在这儿.',w:'车|chē|машина, транспорт;开车|kāichē|водить машину;火车|huǒchē|поезд;飞机|fēijī|самолёт;到|dào|прибывать, до;超市|chāoshì|супермаркет;店|diàn|магазин, лавка;书店|shūdiàn|книжный магазин;房间|fángjiān|комната;桌子|zhuōzi|стол;椅子|yǐzi|стул;住|zhù|жить, проживать;中国|Zhōngguó|Китай;国|guó|страна',s:['我 坐 火车 去 中国|。|Я еду в Китай на поезде.','你 会 开车 吗|？|Ты умеешь водить машину?','你 住 在 哪儿|？|Где ты живёшь?','我 的 房间 很 小|。|Моя комната маленькая.']},
{t:'Где? Стороны и направления',g:'На, под, внутри, впереди, снаружи.',n:'«На», «в», «под» выражают словом после существительного: 桌子上 «на столе», 房间里 «в комнате». Вместе с 在: 书在桌子上.',w:'上|shàng|верх, на;下|xià|низ, под;里|lǐ|внутри, в;前|qián|перед, впереди;后|hòu|сзади, после;外|wài|снаружи;外边|wàibian|снаружи, на улице;边|biān|сторона, край',s:['书 在 桌子 上|。|Книга на столе.','猫 在 房间 里|。|Кошка в комнате.','外边 很 冷|。|На улице холодно.']},
{t:'Погода и здоровье',g:'Дождь, снег, болеть, сходить к врачу.',n:'Осадки описывают глаголом 下: 下雨 «идёт дождь», 下雪 «идёт снег». 了 в конце показывает новое состояние: 他生病了 — «он заболел».',w:'雨|yǔ|дождь;下雨|xiàyǔ|идёт дождь;雪|xuě|снег;病|bìng|болезнь, болеть;生病|shēngbìng|заболеть;看病|kànbìng|сходить к врачу, лечить',s:['明天 下雨 吗|？|Завтра будет дождь?','我 去 医院 看病|。|Я иду в больницу к врачу.','他 生病 了|。|Он заболел.']},
{t:'Служебные слова и частые глаголы',g:'Тоже, все, ещё, можно, знакомы, «мой».',n:'也 и 都 стоят перед глаголом: 我们都是学生, 我也去. 会 — «умею (научился)», 能 — «могу (есть возможность)», 可以 — «можно (разрешение)». 的 значит «чей»: 我的书 «моя книга»; с близкими людьми 的 часто опускают: 我妈妈.',w:'的|de|частица принадлежности (我的 «мой»);和|hé|и (между существительными);也|yě|тоже;都|dōu|все, оба;还|hái|ещё;再|zài|снова, ещё раз;真|zhēn|по-настоящему, очень;只|zhǐ|только;对|duì|верно, правильно;正在|zhèngzài|как раз сейчас (делать);可以|kěyǐ|можно;能|néng|мочь (есть возможность);觉得|juéde|считать, чувствовать;认识|rènshi|быть знакомым, знать (человека);高兴|gāoxìng|радостный;不要|búyào|не надо (запрет);没事|méishì|ничего, всё в порядке;喂|wéi|алло (по телефону);事|shì|дело;东西|dōngxi|вещь;卖|mài|продавать;新|xīn|новый;见|jiàn|видеть, встречаться',s:['我们 都 是 学生|。|Мы все студенты.','这 是 我 的 手机|。|Это мой телефон.','我 可以 坐 这儿 吗|？|Можно мне сесть здесь?','你 觉得 怎么样|？|Как тебе?','他 正在 睡觉|。|Он сейчас спит.']}
);

{h:2,t:'Тело и самочувствие',g:'Части тела, рост, усталость, боль, аптека.',n:'Боль: часть тела + 疼: 我头疼 «у меня болит голова». О росте говорят 个子高: 他个子很高 «он высокий».',w:'身体|shēntǐ|тело, здоровье;头|tóu|голова;手|shǒu|рука (кисть);眼睛|yǎnjing|глаза;个子|gèzi|рост;高|gāo|высокий;长|cháng|длинный;累|lèi|усталый;疼|téng|болеть (о боли);舒服|shūfu|удобный, хорошо (о самочувствии);药|yào|лекарство;药店|yàodiàn|аптека;笑|xiào|смеяться, улыбаться',s:['我 头 疼|。|У меня болит голова.','你 身体 怎么样|？|Как твоё здоровье?','我 今天 很 累|。|Я сегодня очень устал.','他 个子 很 高|。|Он высокий.']},
{h:2,t:'Цвета и вещи',g:'Цвет, одежда, школьные вещи, дом.',n:'Цвет как определение: 红色的包 «красная сумка». В конце фразы — конструкция 是…的: 我的手表是黑色的. Счётное слово 条 — для длинных предметов: 一条裤子.',w:'颜色|yánsè|цвет;白色|báisè|белый цвет;黑色|hēisè|чёрный цвет;红色|hóngsè|красный цвет;绿色|lǜsè|зелёный цвет;裤子|kùzi|брюки;手表|shǒubiǎo|наручные часы;书包|shūbāo|школьный рюкзак;本子|běnzi|тетрадь;笔|bǐ|ручка, карандаш;包|bāo|сумка;床|chuáng|кровать;门|mén|дверь',s:['你 喜欢 什么 颜色|？|Какой цвет тебе нравится?','这 条 裤子 很 贵|。|Эти брюки дорогие.','我 的 手表 是 黑色 的|。|Мои часы чёрные.']},
{h:2,t:'Люди и знакомство',g:'Дедушки и бабушки, муж и жена, фамилия, «представить».',n:'Вежливо о фамилии: 您贵姓? — «Как ваша фамилия?», ответ: 我姓… 位 — вежливое счётное слово для людей: 这位老师. 自己 — «сам, себя»: 我自己去.',w:'爷爷|yéye|дедушка (по отцу);奶奶|nǎinai|бабушка (по отцу);丈夫|zhàngfu|муж;妻子|qīzi|жена;男孩儿|nánháir|мальчик;女孩儿|nǚháir|девочка;小孩儿|xiǎoháir|ребёнок;自己|zìjǐ|сам, себя;姓|xìng|фамилия, носить фамилию;姓名|xìngmíng|фамилия и имя;名|míng|имя, счётное слово для людей;位|wèi|вежливое счётное слово для людей;介绍|jièshào|представлять, знакомить',s:['您 贵 姓|？|Как ваша фамилия?','我 来 介绍 一下|。|Позвольте представить.','这 位 是 我 爷爷|。|Это мой дедушка.','我 丈夫 是 医生|。|Мой муж врач.']},
{h:2,t:'Кофе, чай и ресторан',g:'Напитки, мясо и рыба, «или» в вопросе.',n:'Внимание: 红茶 (букв. «красный чай») — это наш чёрный чай. «Или» в вопросе — 还是: 你吃肉还是吃鱼?',w:'咖啡|kāfēi|кофе;红茶|hóngchá|чёрный чай;绿茶|lǜchá|зелёный чай;奶茶|nǎichá|чай с молоком;肉|ròu|мясо;鱼|yú|рыба;面|miàn|лапша, лицо, сторона;饭馆|fànguǎn|ресторан, кафе;拿|ná|брать, держать;送|sòng|дарить, доставлять, провожать',s:['我 想 喝 咖啡|。|Я хочу кофе.','你 吃 肉 还是 吃 鱼|？|Ты будешь мясо или рыбу?','我们 去 饭馆 吃 饭|。|Мы идём поесть в кафе.']},
{h:2,t:'Транспорт и дорога',g:'Метро, автобус, аэропорт, билеты, пешком.',n:'Транспорт: 坐地铁, 坐公交车, 打车 «взять такси». Направление: 往 + сторона + глагол: 往前走 «идите вперёд».',w:'地铁|dìtiě|метро;公交车|gōngjiāochē|автобус;车站|chēzhàn|остановка, вокзал;机场|jīchǎng|аэропорт;机票|jīpiào|авиабилет;打车|dǎchē|ехать на такси;票|piào|билет;门票|ménpiào|входной билет;路|lù|дорога, маршрут;路上|lùshang|в пути, по дороге;站|zhàn|стоять, станция;往|wǎng|в направлении, к;走|zǒu|идти, уходить;走路|zǒulù|идти пешком',s:['我 坐 地铁 去 机场|。|Я еду в аэропорт на метро.','车站 离 这儿 远 吗|？|Остановка далеко отсюда?','我们 走路 去 吧|。|Давай пойдём пешком.','往 前 走|。|Идите вперёд.']},
{h:2,t:'Места в городе',g:'Вход, торговый центр, отель, туалет, «далеко — близко».',n:'Расстояние: A 离 B 远 / 近: 我家离学校很近 «мой дом близко от школы».',w:'门口|ménkǒu|вход, у дверей;楼|lóu|здание, этаж;商场|shāngchǎng|торговый центр;酒店|jiǔdiàn|отель;洗手间|xǐshǒujiān|туалет;离|lí|от (о расстоянии);远|yuǎn|далёкий;近|jìn|близкий;外国|wàiguó|заграница, иностранный',s:['洗手间 在 哪儿|？|Где туалет?','我 家 离 学校 很 近|。|Мой дом близко от школы.','我 在 门口 等 你|。|Я жду тебя у входа.']},
{h:2,t:'Где именно? Стороны',g:'Рядом, спереди, сзади, слева, справа.',n:'Место: предмет + 在 + ориентир + сторона: 超市在学校旁边 «супермаркет рядом со школой». В русском предлог стоит перед словом, в китайском слово-сторона — после.',w:'旁边|pángbiān|рядом, сбоку;前面|qiánmiàn|впереди;后面|hòumian|сзади;左边|zuǒbian|слева;右边|yòubian|справа;左|zuǒ|левый;右|yòu|правый;里面|lǐmiàn|внутри;外面|wàimiàn|снаружи;上面|shàngmiàn|сверху;下面|xiàmiàn|снизу;间|jiān|между, счётное слово для комнат',s:['超市 在 学校 旁边|。|Супермаркет рядом со школой.','他 在 我 后面|。|Он позади меня.','医院 在 左边|。|Больница слева.']},
{h:2,t:'Глаголы направления',g:'Войти, выйти, вернуться, подняться: сюда или туда.',n:'Первая часть — направление: 进 «внутрь», 出 «наружу», 上 «вверх», 下 «вниз», 回 «обратно», 过 «через, мимо». Вторая — к говорящему (来) или от него (去): 进来 «войди сюда», 进去 «войди туда».',w:'出|chū|выходить;进|jìn|входить;出来|chūlái|выйти (сюда);出去|chūqù|выйти (туда);进来|jìnlái|войти (сюда);进去|jìnqù|войти (туда);回来|huílai|вернуться (сюда);回去|huíqu|вернуться (туда);过来|guòlái|подойти (сюда);过去|guòqù|пройти (туда), прошлое;上来|shànglái|подняться (сюда);上去|shàngqù|подняться (туда);下来|xiàlai|спуститься (сюда);下去|xiàqù|спуститься (туда);起来|qǐlai|встать, подняться;出门|chūmén|выйти из дома;出国|chūguó|поехать за границу',s:['请 进来|。|Входите, пожалуйста.','我 明天 回来|。|Я вернусь завтра.','你 下来 吧|。|Спускайся!','他 出去 了|。|Он вышел.']},
{h:2,t:'Спорт и увлечения',g:'Хобби, бег, плавание, мяч, путешествия, интернет.',n:'Игры с мячом: 踢足球 (ногами), 打篮球 (руками). Хобби: 我的爱好是… «Каждый день» — 每天, 每 ставится перед единицей счёта.',w:'爱好|àihào|увлечение, хобби;运动|yùndòng|спорт, заниматься спортом;跑|pǎo|бегать;跑步|pǎobù|бег трусцой;游|yóu|плавать;游泳|yóuyǒng|плавание, плавать;踢|tī|бить ногой, играть (в футбол);足球|zúqiú|футбол;篮球|lánqiú|баскетбол;球|qiú|мяч;打|dǎ|бить, играть (руками);跳舞|tiàowǔ|танцевать;画|huà|рисовать, картина;花|huā|цветок, тратить;鸟|niǎo|птица;旅游|lǚyóu|путешествовать;上网|shàngwǎng|выходить в интернет;网上|wǎngshàng|в интернете',s:['我 的 爱好 是 游泳|。|Моё хобби — плавание.','他们 在 踢 足球|。|Они играют в футбол.','我 每 天 跑步|。|Я бегаю каждый день.','你 喜欢 旅游 吗|？|Ты любишь путешествовать?']},

{h:2,t:'Время и частота',g:'Каждый, часто, уже, вот-вот, с детства, день рождения.',n:'Частота: 每周 + число + 次: 每周两次 «два раза в неделю». 已经…了 — «уже»: 我已经吃了. 快要…了 — «вот-вот»: 快要下雨了.',w:'时|shí|время, час;次|cì|раз;周|zhōu|неделя;每|měi|каждый;经常|jīngcháng|часто;有时|yǒushí|иногда;已经|yǐjīng|уже;快要|kuàiyào|вот-вот;一会儿|yíhuìr|немного (о времени), скоро;开始|kāishǐ|начинать;完|wán|заканчивать;从|cóng|от, с (времени, места);从小|cóngxiǎo|с детства;小时候|xiǎoshíhou|в детстве;过年|guònián|встречать Новый год (праздник Весны);生日|shēngrì|день рождения;等|děng|ждать;准备|zhǔnbèi|готовиться, собираться',s:['我 已经 吃 了|。|Я уже поел.','请 等 一下|。|Подождите немного.','我 每 周 去 两 次|。|Я хожу туда два раза в неделю.','今天 是 我 的 生日|。|Сегодня мой день рождения.']},
